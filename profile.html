<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài Khoản Thành Viên - Trà Sữa ĐÔ ĐÔ</title>
  <meta name="description" content="Quản lý thông tin cá nhân, điểm tích lũy thành viên và lịch sử đơn hàng tại Trà Sữa ĐÔ ĐÔ.">

  <!-- Google Fonts for Vietnamese Support -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/client.css">

  <style>
    .member-tier-card {
      background: linear-gradient(135deg, #1D1919 0%, #C4001D 100%);
      color: #fff;
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow-xl);
      position: relative;
      overflow: hidden;
    }
    .member-tier-card::after {
      content: '🧋';
      position: absolute;
      right: -10px;
      bottom: -20px;
      font-size: 8rem;
      opacity: 0.12;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-logo">
        <div class="logo-icon">
          <img src="images/dodo-logo.svg" alt="Trà Sữa ĐÔ ĐÔ Logo">
        </div>
        <span>ĐÔ</span> ĐÔ
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Trang Chủ</a>
        <a href="menu.html" class="nav-link">Thực Đơn</a>
        <a href="#" class="nav-link" onclick="ClientApp.openLuckyWheel(); return false;">🎁 Vòng Quay</a>
        <a href="order-tracking.html" class="nav-link">Tra Cứu Đơn</a>
        <a href="profile.html" class="nav-link active">Thành Viên</a>
      </nav>

      <div class="header-actions">
        <a href="cart.html" class="action-btn" title="Giỏ hàng">
          🛒
          <span class="cart-count-badge" style="display: none;">0</span>
        </a>
        <div class="header-user-action"></div>
      </div>
    </div>
  </header>

  <main class="container" style="padding-block: 2.5rem 4rem;">
    <!-- Top Member Card Banner -->
    <div class="member-tier-card" style="margin-bottom: 2.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
        <div>
          <span class="badge badge-warning" id="user-tier-badge" style="margin-bottom: 0.5rem;">VIP VÀNG</span>
          <h2 style="color: #fff; font-size: 1.85rem; margin-bottom: 2px;" id="user-display-name">Lê Hoàng Phúc</h2>
          <p style="color: #DDB892; font-size: 0.9rem;" id="user-phone-display">0987654321</p>
        </div>
        <div style="text-align: right;">
          <div style="font-size: 0.85rem; color: #DDB892;">ĐIỂM TÍCH LŨY TEAJOY</div>
          <div style="font-size: 2.4rem; font-weight: 800; color: #E9C46A; font-family: var(--font-heading);" id="user-points-display">320</div>
        </div>
      </div>

      <div style="margin-top: 1.5rem; max-width: 480px;">
        <div class="flex justify-between text-xs" style="color: #DDB892; margin-bottom: 4px;">
          <span>Tiến độ lên hạng Kim Cương</span>
          <span>320 / 500 Điểm</span>
        </div>
        <div style="width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: var(--radius-full); overflow: hidden;">
          <div style="width: 64%; height: 100%; background: linear-gradient(90deg, #F4A261, #E9C46A);"></div>
        </div>
      </div>
    </div>

    <!-- Tabs: Lịch sử đơn hàng, Ví voucher, Thông tin -->
    <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 2rem;">
      <!-- Left: Order History -->
      <div class="card" style="padding: 1.75rem;">
        <h4 style="margin-bottom: 1.25rem;">📜 Lịch Sử Đơn Hàng Của Bạn</h4>
        <div id="profile-orders-list" style="display: flex; flex-direction: column; gap: 1rem;">
          <!-- Injected by JS -->
        </div>
      </div>

      <!-- Right: Available Vouchers & Profile update -->
      <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        <!-- Vouchers -->
        <div class="card" style="padding: 1.75rem;">
          <h4 style="margin-bottom: 1.25rem;">🎟️ Ví Voucher Của Bạn</h4>
          <div id="profile-vouchers-list" style="display: flex; flex-direction: column; gap: 0.75rem;">
            <!-- Injected by JS -->
          </div>
        </div>

        <!-- Personal Info -->
        <div class="card" style="padding: 1.75rem;">
          <h4 style="margin-bottom: 1.25rem;">👤 Cập Nhật Thông Tin Cá Nhân</h4>
          <form onsubmit="saveProfileInfo(event)">
            <div class="form-group">
              <label class="form-label text-xs">Họ và tên</label>
              <input type="text" id="prof-name" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label text-xs">Số điện thoại</label>
              <input type="tel" id="prof-phone" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label text-xs">Địa chỉ giao hàng mặc định</label>
              <input type="text" id="prof-address" class="form-control">
            </div>
            <div style="display: flex; gap: 0.75rem; align-items: center; margin-top: 1rem;">
              <button type="submit" class="btn btn-primary btn-sm">💾 Lưu Thay Đổi</button>
              <button type="button" class="btn btn-danger btn-sm" onclick="Auth.logout()">🚪 Đăng Xuất Tài Khoản</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 TeaJoy Store. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/db/mock-data.js"></script>
  <script src="js/db/storage.js"></script>
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/toast.js"></script>
  <script src="js/utils/modal.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/client.js"></script>

  <script>
    function initProfilePage() {
      const user = Auth.getCurrentUser();
      if (!user) {
        Toast.warning("Vui lòng đăng nhập để xem thông tin thành viên!");
        setTimeout(() => Auth.openAuthModal("login"), 400);
        return;
      }

      document.getElementById("user-display-name").textContent = user.fullName || "Khách Hàng";
      document.getElementById("user-phone-display").textContent = user.phone || "Chưa cập nhật SĐT";
      document.getElementById("user-points-display").textContent = user.points || 0;
      document.getElementById("user-tier-badge").textContent = user.tier || "VIP ĐỒNG";

      document.getElementById("prof-name").value = user.fullName || "";
      document.getElementById("prof-phone").value = user.phone || "";
      document.getElementById("prof-address").value = user.address || "";

      // Render Orders (Filtered for current logged-in user)
      const allOrders = DB.getOrders();
      const userOrders = allOrders.filter(o => 
        (user.phone && o.customerPhone === user.phone) || 
        (user.fullName && o.customerName === user.fullName)
      );

      const orderListEl = document.getElementById("profile-orders-list");
      if (orderListEl) {
        if (userOrders.length === 0) {
          orderListEl.innerHTML = `
            <div style="text-align: center; padding: 2.5rem 1rem;">
              <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🛍️</div>
              <p class="text-sm text-muted" style="margin-bottom: 1rem;">Bạn chưa tạo đơn hàng nào trên hệ thống.</p>
              <a href="menu.html" class="btn btn-primary btn-sm">Khám phá thực đơn & Đặt món ngay ➔</a>
            </div>
          `;
        } else {
          orderListEl.innerHTML = userOrders.map(o => `
            <div style="border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 1rem; background-color: var(--bg-card-hover);">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <span class="font-bold text-sm" style="color: var(--primary);">#${o.id}</span>
                ${Formatters.orderStatusBadge(o.orderStatus)}
              </div>
              <div class="text-xs text-muted" style="margin-bottom: 0.5rem;">
                ${Formatters.dateTime(o.createdAt)} • ${o.items ? o.items.length : 0} món
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="font-bold" style="color: var(--primary);">${Formatters.currency(o.totalAmount)}</span>
                <a href="order-tracking.html?id=${o.id}" class="btn btn-outline btn-sm">Xem chi tiết ➔</a>
              </div>
            </div>
          `).join("");
        }
      }

      // Render Vouchers
      const vouchers = DB.getVouchers();
      const voucherListEl = document.getElementById("profile-vouchers-list");
      if (voucherListEl) {
        voucherListEl.innerHTML = vouchers.map(v => `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border: 1.5px dashed var(--primary-light); border-radius: var(--radius-md); background-color: var(--primary-bg);">
            <div>
              <div class="font-bold text-sm" style="color: var(--primary);">${v.code}</div>
              <div class="text-xs text-muted">${v.desc}</div>
            </div>
            <button class="btn btn-primary btn-sm" onclick="navigator.clipboard.writeText('${v.code}'); Toast.success('Đã sao chép mã: ${v.code}');">Sao chép</button>
          </div>
        `).join("");
      }
    }

    function saveProfileInfo(e) {
      e.preventDefault();
      const user = Auth.getCurrentUser() || DB.getUsers()[2];
      user.fullName = document.getElementById("prof-name").value;
      user.phone = document.getElementById("prof-phone").value;
      user.address = document.getElementById("prof-address").value;
      DB.saveUser(user);
      DB.setCurrentUser(user);
      Toast.success("Cập nhật thông tin thành công!");
      initProfilePage();
    }

    document.addEventListener("DOMContentLoaded", initProfilePage);
  </script>
</body>
</html>
