<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dodoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B0018"/>
      <stop offset="50%" stop-color="#9B0024"/>
      <stop offset="100%" stop-color="#C41535"/>
    </linearGradient>

    <!-- Milk Tea Liquid Gradient -->
    <linearGradient id="teaLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5C396"/>
      <stop offset="100%" stop-color="#DE9E66"/>
    </linearGradient>

    <!-- Mochi Cream Gradient -->
    <linearGradient id="mochiCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0E6"/>
    </linearGradient>

    <!-- Straw Gradient -->
    <linearGradient id="strawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#9B0024" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#dodoBg)" filter="url(#badgeShadow)"/>
  <circle cx="96" cy="24" r="14" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="20" cy="94" r="8" fill="#FFFFFF" opacity="0.12"/>

  <!-- Straw -->
  <path d="M68 18 L76 44 L70 46 L62 20 Z" fill="url(#strawGrad)"/>
  <line x1="64" y1="23" x2="72" y2="25" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="66" y1="32" x2="74" y2="34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Cup Container (Body) -->
  <path d="M35 44 L40 92 C40.5 97 45 101 50 101 L70 101 C75 101 79.5 97 80 92 L85 44 Z" fill="#FFFFFF" opacity="0.95"/>

  <!-- Cup Liquid Inside -->
  <path d="M38 56 L41.5 90 C41.8 93.5 45 96 48.5 96 L71.5 96 C75 96 78.2 93.5 78.5 90 L82 56 Z" fill="url(#teaLiquid)"/>

  <!-- Fluffy Mochi Foam Top -->
  <path d="M32 44 C32 39 37 36 43 38 C47 34 54 34 58 37 C62 33 70 33 75 37 C81 35 88 38 88 44 C88 47 85 49 81 49 L39 49 C34 49 32 47 32 44 Z" fill="url(#mochiCream)"/>
  <!-- Mochi glossy drip -->
  <path d="M50 49 C50 54 55 55 55 50" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M66 49 C66 56 72 56 72 50" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Boba Pearls -->
  <circle cx="49" cy="88" r="4.2" fill="#2B2D42"/>
  <circle cx="50" cy="87" r="1.2" fill="#FFFFFF" opacity="0.7"/>

  <circle cx="61" cy="90" r="4.2" fill="#2B2D42"/>
  <circle cx="62" cy="89" r="1.2" fill="#FFFFFF" opacity="0.7"/>

  <circle cx="71" cy="87" r="4.2" fill="#2B2D42"/>
  <circle cx="72" cy="86" r="1.2" fill="#FFFFFF" opacity="0.7"/>

  <circle cx="56" cy="81" r="3.8" fill="#3D3A45"/>
  <circle cx="57" cy="80" r="1" fill="#FFFFFF" opacity="0.7"/>

  <circle cx="66" cy="80" r="3.8" fill="#3D3A45"/>
  <circle cx="67" cy="79" r="1" fill="#FFFFFF" opacity="0.7"/>

  <!-- Happy Face on Cup -->
  <circle cx="53" cy="68" r="2.2" fill="#8D5B4C"/>
  <circle cx="67" cy="68" r="2.2" fill="#8D5B4C"/>
  <path d="M58 72 Q60 75 62 72" stroke="#8D5B4C" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Cute Blushes -->
  <ellipse cx="48" cy="70" rx="2.5" ry="1.2" fill="#FF758F" opacity="0.6"/>
  <ellipse cx="72" cy="70" rx="2.5" ry="1.2" fill="#FF758F" opacity="0.6"/>

  <!-- Sparkle Stars -->
  <path d="M22 28 L24 22 L26 28 L32 30 L26 32 L24 38 L22 32 L16 30 Z" fill="#FFE66D"/>
  <circle cx="98" cy="54" r="2" fill="#FFE66D"/>
</svg>
